name: Securechat Android APK and iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: securechat-mobile-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffolding
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=android,ios --org com.securechat.app .
          fi
      - name: Ensure Android release network permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          required = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          missing = [p for p in required if f'android:name="{p}"' not in text]
          if missing:
              marker = "<application"
              if marker not in text:
                  raise SystemExit("AndroidManifest.xml: application tag missing")
              block = "".join(
                  f'    <uses-permission android:name="{permission}" />\n'
                  for permission in missing
              )
              text = text.replace(marker, block + marker, 1)
              manifest.write_text(text)
          ET.parse(manifest)
          check = manifest.read_text()
          if 'android:name="android.permission.INTERNET"' not in check:
              raise SystemExit("INTERNET permission missing from release manifest")
          print("Release manifest validated: INTERNET permission is present.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL secret is empty" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "SUPABASE_ANON_KEY secret is empty" && exit 1)
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Securechat-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffolding
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=android,ios --org com.securechat.app .
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Build unsigned IPA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL secret is empty" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "SUPABASE_ANON_KEY secret is empty" && exit 1)
          flutter build ipa --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          /usr/bin/zip -qry Securechat-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Securechat-iOS-IPA-Unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

# Trigger build on main via repository update.
