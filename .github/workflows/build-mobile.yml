name: Securechat Android APK and iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: securechat-mobile-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffolding
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=android,ios --org com.securechat.app .
          fi
      - name: Enable core library desugaring for local notifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found after Flutter scaffolding")
          text = gradle.read_text()

          if gradle.suffix == ".kts":
              enabled = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              enabled = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if "coreLibraryDesugaringEnabled" not in text and "isCoreLibraryDesugaringEnabled" not in text:
              marker = "compileOptions {"
              if marker not in text:
                  raise SystemExit(f"compileOptions block not found in {gradle}")
              text = text.replace(marker, marker + "\n        " + enabled, 1)

          if "desugar_jdk_libs" not in text:
              marker = "dependencies {"
              if marker in text:
                  text = text.replace(marker, marker + "\n    " + dependency, 1)
              else:
                  text = text.rstrip() + "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(text)
          check = gradle.read_text()
          if enabled not in check or "desugar_jdk_libs" not in check:
              raise SystemExit("Core library desugaring validation failed")
          print(f"Core library desugaring enabled in {gradle}.")
          PY
      - name: Ensure Android release network permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          required = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          missing = [p for p in required if f'android:name="{p}"' not in text]
          if missing:
              marker = "<application"
              if marker not in text:
                  raise SystemExit("AndroidManifest.xml: application tag missing")
              block = "".join(
                  f'    <uses-permission android:name="{permission}" />\n'
                  for permission in missing
              )
              text = text.replace(marker, block + marker, 1)
              manifest.write_text(text)
          ET.parse(manifest)
          check = manifest.read_text()
          if 'android:name="android.permission.INTERNET"' not in check:
              raise SystemExit("INTERNET permission missing from release manifest")
          print("Release manifest validated: INTERNET permission is present.")
          PY
      - name: Configure Android call foreground service
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          permissions = [
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.FOREGROUND_SERVICE_CAMERA",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.WAKE_LOCK",
          ]
          for permission in permissions:
              if f'android:name="{permission}"' not in text:
                  text = text.replace("<application", f'    <uses-permission android:name="{permission}" />\n<application', 1)
          if "com.securechat.app.CallForegroundService" not in text and 'android:name=".CallForegroundService"' not in text:
              text = text.replace("<application", '<application', 1)
              close = "</application>"
              service = '    <service android:name=".CallForegroundService" android:enabled="true" android:exported="false" android:stopWithTask="false" android:foregroundServiceType="microphone|camera" />\n'
              text = text.replace(close, service + close, 1)
          manifest.write_text(text)
          ET.parse(manifest)

          main = next(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          main_text = main.read_text()
          package_match = re.search(r"^package ([\w.]+)", main_text, re.M)
          if not package_match:
              raise SystemExit("Could not determine MainActivity package")
          package_name = package_match.group(1)
          service_path = Path("android/app/src/main/kotlin") / Path(*package_name.split(".")) / "CallForegroundService.kt"
          service_path.parent.mkdir(parents=True, exist_ok=True)
          service_path.write_text("""package PACKAGE_NAME

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class CallForegroundService : Service() {
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CHANNEL_ID, "Securechat araması", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val video = intent?.getBooleanExtra("video", false) == true
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.sym_call_outgoing)
                          .setContentTitle("Securechat araması")
                          .setContentText(if (video) "Görüntülü görüşme sürüyor" else "Sesli görüşme sürüyor")
                          .setCategory(Notification.CATEGORY_CALL)
                          .setOngoing(true)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setSmallIcon(android.R.drawable.sym_call_outgoing)
                          .setContentTitle("Securechat araması")
                          .setContentText("Görüşme sürüyor")
                          .setOngoing(true)
                          .build()
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      var types = ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      if (video) types = types or ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA
                      startForeground(NOTIFICATION_ID, notification, types)
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }
                  return START_NOT_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              companion object {
                  private const val CHANNEL_ID = "securechat_call_service"
                  private const val NOTIFICATION_ID = 4107
              }
          }
          """.replace("PACKAGE_NAME", package_name))
          if "MethodChannel(flutterEngine.dartExecutor.binaryMessenger, \"securechat/call_service\")" not in main_text:
              if "import android.content.Intent" not in main_text:
                  main_text = main_text.replace(package_match.group(0), package_match.group(0) + "\nimport android.content.Intent")
              if "import android.os.Build" not in main_text:
                  main_text = main_text.replace(package_match.group(0), package_match.group(0) + "\nimport android.os.Build")
              if "import io.flutter.embedding.engine.FlutterEngine" not in main_text:
                  main_text = main_text.replace(package_match.group(0), package_match.group(0) + "\nimport io.flutter.embedding.engine.FlutterEngine")
              if "import io.flutter.plugin.common.MethodChannel" not in main_text:
                  main_text = main_text.replace(package_match.group(0), package_match.group(0) + "\nimport io.flutter.plugin.common.MethodChannel")
              main_text = re.sub(
                  r"class MainActivity : FlutterActivity\(\)\s*\{?\s*\}?",
                  """class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "securechat/call_service").setMethodCallHandler { call, result ->
                      when (call.method) {
                          "start" -> {
                              val video = call.argument<Boolean>("video") ?: false
                              val intent = Intent(this, CallForegroundService::class.java).putExtra("video", video)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                              result.success(true)
                          }
                          "stop" -> {
                              stopService(Intent(this, CallForegroundService::class.java))
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }""",
                  main_text,
                  count=1,
              )
          main.write_text(main_text)
          print("Android call foreground service and method channel configured.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL secret is empty" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "SUPABASE_ANON_KEY secret is empty" && exit 1)
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Securechat-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-ipa:
    name: Build signed iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform scaffolding
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=android,ios --org com.securechat.app .
          fi
      - name: Ensure iOS camera and microphone purpose strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("ios/Runner/Info.plist")
          with path.open("rb") as f:
              data = plistlib.load(f)
          data["NSCameraUsageDescription"] = "Securechat uses the camera for video calls and sending photos or videos."
          data["NSMicrophoneUsageDescription"] = "Securechat uses the microphone for voice and video calls and voice messages."
          modes = list(data.get("UIBackgroundModes", []))
          if "audio" not in modes:
              modes.append("audio")
          data["UIBackgroundModes"] = modes
          with path.open("wb") as f:
              plistlib.dump(data, f, sort_keys=False)
          with path.open("rb") as f:
              check = plistlib.load(f)
          for key in ("NSCameraUsageDescription", "NSMicrophoneUsageDescription"):
              if not check.get(key, "").strip():
                  raise SystemExit(f"{key} missing")
          print("Camera and microphone usage descriptions validated.")
          PY

      - name: Install Apple signing certificate and profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IOS_P12_BASE64" || (echo "::error::Missing IOS_P12_BASE64 GitHub secret" && exit 1)
          test -n "$IOS_P12_PASSWORD" || (echo "::error::Missing IOS_P12_PASSWORD GitHub secret" && exit 1)
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || (echo "::error::Missing IOS_PROVISIONING_PROFILE_BASE64 GitHub secret" && exit 1)
          test -n "$IOS_TEAM_ID" || (echo "::error::Missing IOS_TEAM_ID GitHub secret" && exit 1)

          KEYCHAIN_PATH="$RUNNER_TEMP/securechat-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain-password"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          P12_PATH="$RUNNER_TEMP/securechat-signing.p12"
          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$P12_PATH"
          if ! file "$P12_PATH" | grep -qi 'data\|pkcs'; then
            echo "::error::IOS_P12_BASE64 did not decode to a readable certificate file"
            exit 1
          fi
          # Validate the uploaded P12/password pair first. Then re-export it in
          # legacy PKCS#12 encryption for compatibility with macOS security import.
          if ! openssl pkcs12 -in "$P12_PATH" -passin env:IOS_P12_PASSWORD -noout; then
            echo "::error::The decoded P12 cannot be opened with IOS_P12_PASSWORD."
            exit 1
          fi
          PEM_PATH="$RUNNER_TEMP/securechat-signing.pem"
          COMPAT_P12_PATH="$RUNNER_TEMP/securechat-signing-compat.p12"
          openssl pkcs12 -in "$P12_PATH" -passin env:IOS_P12_PASSWORD \
            -nodes -out "$PEM_PATH"
          openssl pkcs12 -export -in "$PEM_PATH" \
            -out "$COMPAT_P12_PATH" -passout env:IOS_P12_PASSWORD \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          rm -f "$PEM_PATH"
          security import "$COMPAT_P12_PATH" \
            -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12_PATH" "$COMPAT_P12_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          PROFILE_PATH="$RUNNER_TEMP/securechat.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${PROFILE_APP_ID#*.}"
          if [ "$PROFILE_TEAM_ID" != "$IOS_TEAM_ID" ]; then
            echo "::error::IOS_TEAM_ID does not match the provisioning profile Team ID"
            exit 1
          fi
          case "$BUNDLE_ID" in
            *\*) echo "::error::Provisioning profile must use an explicit App ID, not a wildcard"; exit 1 ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "Signing profile and Team ID validated; bundle identifier detected from profile."

      - name: Configure bundle identifier for profile
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = p.read_text()
          bundle_id = os.environ["IOS_BUNDLE_ID"]
          team_id = os.environ["IOS_TEAM_ID"].strip()
          if not team_id:
              raise SystemExit("IOS_TEAM_ID is empty; cannot configure Xcode signing")

          # Update all generated bundle IDs, then explicitly add the team to
          # every build-configuration setting that contains a bundle ID.
          text, bundle_count = re.subn(
              r"PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;",
              lambda m: f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};",
              text,
          )
          if bundle_count == 0:
              raise SystemExit("No PRODUCT_BUNDLE_IDENTIFIER setting found in generated Xcode project; inspect generated pbxproj format")

          lines = text.splitlines()
          out = []
          team_count = 0
          i = 0
          while i < len(lines):
              line = lines[i]
              if "PRODUCT_BUNDLE_IDENTIFIER = " in line:
                  indent = line[:len(line) - len(line.lstrip(" \t"))]
                  # Replace an existing team setting in the same build-settings
                  # block, or insert one directly above the bundle identifier.
                  block_start = len(out) - 1
                  while block_start >= 0 and "buildSettings = {" not in out[block_start]:
                      block_start -= 1
                  block_end = i + 1
                  while block_end < len(lines) and "};" not in lines[block_end]:
                      block_end += 1
                  existing = next((j for j in range(block_start + 1, min(block_end + 1, len(out))) if "DEVELOPMENT_TEAM = " in out[j]), None)
                  if existing is not None:
                      out[existing] = re.sub(r"DEVELOPMENT_TEAM = [^;]+;", f"DEVELOPMENT_TEAM = {team_id};", out[existing])
                  else:
                      out.append(f"{indent}DEVELOPMENT_TEAM = {team_id};")
                  team_count += 1
              out.append(line)
              i += 1

          # Force manual App Store signing during the archive stage as well as export.
          profile_name = os.environ.get("IOS_PROFILE_NAME", "").strip()
          if not profile_name:
              raise SystemExit("IOS_PROFILE_NAME is empty; cannot configure manual signing")
          configured = []
          for line in out:
              if "PRODUCT_BUNDLE_IDENTIFIER = " in line:
                  indent = line[:len(line) - len(line.lstrip(" \t"))]
                  configured.extend([
                      f'{indent}CODE_SIGN_STYLE = Manual;',
                      f'{indent}CODE_SIGN_IDENTITY = "Apple Distribution";',
                      f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";',
                  ])
              configured.append(line)
          p.write_text("\n".join(configured) + "\n")
          final_text = p.read_text()
          for required in ("DEVELOPMENT_TEAM = ", "CODE_SIGN_STYLE = Manual;", 'CODE_SIGN_IDENTITY = "Apple Distribution";', f'PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'):
              if required not in final_text:
                  raise SystemExit(f"Manual signing setting missing after write: {required}")
          print(f"Configured bundle identifier ({bundle_count}), team ({team_count}), and manual distribution signing.")
          PY

      - name: Install dependencies
        run: flutter pub get
      - name: Build signed IPA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || (echo "::error::SUPABASE_URL secret is empty" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "::error::SUPABASE_ANON_KEY secret is empty" && exit 1)
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_NAME</string></dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID"
          test -n "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/ipa-check/Payload/Runner.app"
          codesign -dv "$RUNNER_TEMP/ipa-check/Payload/Runner.app" 2>&1 | grep -E 'TeamIdentifier|Identifier'
          echo "Signed IPA verified: $IPA_PATH"

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_API_KEY_ID" || (echo "::error::Missing APP_STORE_CONNECT_API_KEY_ID secret" && exit 1)
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || (echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID secret" && exit 1)
          test -n "$APP_STORE_CONNECT_API_KEY_P8" || (echo "::error::Missing APP_STORE_CONNECT_API_KEY_P8 secret" && exit 1)

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" || (echo "::error::No IPA found to upload" && exit 1)
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          rm -f "$KEY_PATH"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Securechat-iOS-IPA-Signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

