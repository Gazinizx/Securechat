name: Android APK
"on":
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --platforms=android .
      - name: Set Android minimum SDK and permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          marker = "    <application"
          missing = [p for p in permissions if f'android:name="{p}"' not in text]
          if missing:
              if marker not in text:
                  raise SystemExit("AndroidManifest.xml: application marker missing")
              block = "".join(f'    <uses-permission android:name="{p}" />\\n' for p in missing)
              text = text.replace(marker, block + marker, 1)
              manifest.write_text(text)
          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              source = gradle.read_text()
              source = source.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              gradle.write_text(source)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: securechat-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
