name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Build Android APK with SecureChat Supabase project
        env:
          SUPABASE_URL: https://dlcwqphvprvrczljgqzi.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_fr5bM2QaaTgYAeZDiTEnyw_Q9Z_dfS-
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: securechat-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
