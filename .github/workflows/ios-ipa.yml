name: SecureChat Android APK + iOS IPA
# Rebuild after the Supabase publishable key secret was updated.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate signing secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for name in IOS_P12_BASE64 IOS_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - run: flutter create --platforms=android,ios .

      - name: Configure Android internet and media-call permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '    <application'
          permissions = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
          ]
          missing = [name for name in permissions if f'android:name="{name}"' not in s]
          if missing:
              lines = ''.join(f'    <uses-permission android:name="{name}" />\n' for name in missing)
              if marker not in s:
                  raise SystemExit('Android manifest application marker not found')
              s = s.replace(marker, lines + marker, 1)
              p.write_text(s)
          if 'android.permission.INTERNET' not in p.read_text():
              raise SystemExit('INTERNET permission was not added to release manifest')
          PY

      - name: Set SecureChat iOS bundle identifier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text()
          s = s.replace("com.example.securechat", "com.gazinizx.securechat")
          p.write_text(s)
          if "com.gazinizx.securechat" not in p.read_text():
              raise SystemExit("Could not set SecureChat bundle identifier")
          PY

      - name: Configure iOS media-call permissions
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("ios/Runner/Info.plist")
          data = plistlib.loads(p.read_bytes())
          data["NSCameraUsageDescription"] = "SecureChat uses the camera for video calls."
          data["NSMicrophoneUsageDescription"] = "SecureChat uses the microphone for voice and video calls."
          # Register securechat://login-callback/ for Supabase email verification.
          url_types = data.setdefault("CFBundleURLTypes", [])
          if not any("securechat" in item.get("CFBundleURLSchemes", []) for item in url_types):
              url_types.append({"CFBundleURLName": "com.gazinizx.securechat", "CFBundleURLSchemes": ["securechat"]})
          p.write_bytes(plistlib.dumps(data))
          check = plistlib.loads(p.read_bytes())
          if not any("securechat" in item.get("CFBundleURLSchemes", []) for item in check.get("CFBundleURLTypes", [])):
              raise SystemExit("SecureChat email callback scheme was not added to Info.plist")
          PY

      - name: Install Apple signing certificate and provisioning profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/securechat-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | python3 -c 'import plistlib,sys; print(plistlib.loads(sys.stdin.buffer.read())["UUID"])')
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure manual App Store signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text()
          team = os.environ["IOS_TEAM_ID"]
          profile = os.environ["PROFILE_UUID"]
          # Apply explicit distribution signing to the Runner target's Release configuration only.
          pattern = r'(?P<head>[A-F0-9]{24} /\* Release \*/ = \{.*?isa = XCBuildConfiguration;.*?buildSettings = \{)(?P<body>.*?)(?P<tail>\n\s*\};\n\s*name = Release;\n\s*\};)'
          matches = list(re.finditer(pattern, s, re.S))
          if not matches:
              raise SystemExit("Could not find Xcode Release build configurations")
          # Identify the Runner target's Release configuration by its existing bundle identifier.
          selected = None
          for m in matches:
              body = m.group("body")
              if "PRODUCT_BUNDLE_IDENTIFIER = com.gazinizx.securechat;" in body or "PRODUCT_BUNDLE_IDENTIFIER = com.example.securechat;" in body:
                  selected = m
                  break
          if selected is None:
              # Flutter's generated Runner target uses the product bundle identifier in the Release settings.
              raise SystemExit("Could not identify Runner Release signing configuration")
          body = selected.group("body")
          body = re.sub(r'CODE_SIGN_STYLE = [^;]+;', 'CODE_SIGN_STYLE = Manual;', body)
          body = re.sub(r'CODE_SIGN_IDENTITY = [^;]+;', 'CODE_SIGN_IDENTITY = "Apple Distribution";', body)
          body = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', f'DEVELOPMENT_TEAM = {team};', body)
          body = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;', f'PROVISIONING_PROFILE_SPECIFIER = {profile};', body)
          for key, value in [
              ("CODE_SIGN_STYLE", "Manual"),
              ("CODE_SIGN_IDENTITY", '"Apple Distribution"'),
              ("DEVELOPMENT_TEAM", team),
              ("PROVISIONING_PROFILE_SPECIFIER", profile),
          ]:
              if not re.search(rf'\b{key}\s*=', body):
                  body += f'\n\t\t\t\t{key} = {value};'
          updated = s[:selected.start("body")] + body + s[selected.end("body"):]
          p.write_text(updated)
          print("Configured manual distribution signing for Runner Release.")
          PY

      - name: Set unique iOS build number
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          s, n = re.subn(r'^version:\s*([^+\n]+)\+\d+\s*$', lambda m: "version: " + m.group(1) + "+" + run_number, s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("Could not set a unique Flutter build number")
          p.write_text(s)
          print("Set iOS build number to workflow run number.")
          PY

      - name: Validate Supabase project endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          expected = "dlcwqphvprvrczljgqzi.supabase.co"
          value = os.environ["SUPABASE_URL"].strip()
          parsed = urlparse(value)
          if parsed.scheme != "https" or parsed.hostname != expected or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("SUPABASE_URL secret does not match the verified SecureChat Supabase project endpoint.")
          print("Supabase endpoint verified:", parsed.hostname)
          PY

      - name: Build Flutter dependencies and tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter test
          flutter analyze --no-fatal-infos

      - name: Build Android APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: securechat-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build signed IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.gazinizx.securechat</key><string>$PROFILE_UUID</string></dict>
            <key>destination</key><string>export</string>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: securechat-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Add the App Store Connect API key secrets before this workflow can upload the IPA."
              exit 1
            fi
          done
          mkdir -p "$HOME/.private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
