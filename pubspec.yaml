name: securechat
description: Privacy-first cross-platform messenger foundation
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  connectivity_plus: ^6.1.3
  uuid: ^4.5.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path_provider: ^2.1.5
  flutter_webrtc: ^1.6.2+hotfix.4
dependency_overrides:
  # 2.5.0 causes Android release crashes with R8 (SharedPreferencesApiRegistrar.getAll).
  shared_preferences_android: 2.4.28
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
